name: Check

on:
  push:
    branches: [main]
  pull_request:
    # "edited" includes a change of base branch, so a PR retargeted to main gets checked.
    types: [opened, synchronize, reopened, edited]

jobs:
  removed-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills for removed hoist-react APIs
        run: python3 .github/scripts/check-removed-apis.py

  # A change that reaches main must ship under a new version, or consumers never get it.
  # Pull requests into other branches, such as a staging branch, skip this check. A PR compares
  # with the current tip of main, so a re-run after main moves is still accurate.
  version-bump:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that changes to main ship a new version
        run: python3 .github/scripts/check-version-bump.py "$BASE"
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
